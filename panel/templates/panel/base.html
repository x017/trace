{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel{% endblock %} — Admin</title>
    <style>
        :root {
            --bg: #0f0f10;
            --bg-panel: #17171a;
            --bg-hover: #202024;
            --border: #27272a;
            --text: #e4e4e7;
            --text-dim: #8b8b92;
            --accent: #6366f1;
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            font-size: 14px;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar-brand {
            font-size: 16px;
            font-weight: 600;
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .sidebar-brand span { color: var(--accent); }

        .nav-section {
            padding: 0 12px;
        }

        .nav-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            padding: 8px 12px 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius);
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
        }

        .nav-link:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .nav-link.active {
            background: var(--bg-hover);
            color: var(--text);
        }

        .nav-link.active::before {
            content: "";
            width: 3px;
            height: 16px;
            background: var(--accent);
            border-radius: 2px;
            margin-left: -15px;
            margin-right: 7px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 20px 0;
            border-top: 1px solid var(--border);
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: var(--radius);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
        }

        .user-name { font-weight: 500; }
        .user-role { font-size: 12px; color: var(--text-dim); }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 56px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .topbar h1 {
            font-size: 15px;
            font-weight: 600;
        }

        .content {
            padding: 24px;
            flex: 1;
        }

        /* Reusable bits for dashboard/pages */
        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }

        .grid {
            display: grid;
            gap: 16px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            margin-top: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
        }

        a { color: var(--accent); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">panel<span>.</span></div>

        <nav class="nav-section">
            <div class="nav-label">Content</div>
            <a href="{% url 'panel:dashboard' %}" class="nav-link {% if active == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="{% url 'panel:posts' %}" class="nav-link {% if active == 'posts' %}active{% endif %}">Posts</a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-chip">
                <div class="user-avatar">{{ request.user.username|first|upper }}</div>
                <div>
                    <div class="user-name">{{ request.user.username }}</div>
                    <div class="user-role">Admin</div>
                </div>
            </div>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>{% block page_title %}Dashboard{% endblock %}</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>

</body>
</html>
